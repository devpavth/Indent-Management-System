<div
  class="fixed bottom-0 left-0 right-0 top-0 z-20 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-black bg-opacity-50 backdrop-blur-sm"
>
  <div class="relative h-full w-full max-w-lg p-4 md:h-auto">
    <!-- Modal content -->
    <div
      class="animate__animated animate__bounceIn animate__faster relative rounded-lg bg-white p-4 text-center shadow dark:bg-gray-800 sm:p-5"
      >
      <div class="mr-4 mt-6">
        <h1 class="text-xl font-semibold text-purple-800">Utilizing {{checkedFund.branchName}} Fund Amount</h1>
      </div>
      <button
        (click)="closePopUp()"
        type="button"
        class="absolute right-2.5 top-2.5 ml-auto inline-flex items-center rounded-lg bg-transparent p-1.5 text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
        data-modal-toggle="successModal"
      >
        <svg
          aria-hidden="true"
          class="h-5 w-5"
          fill="currentColor"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          ></path>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
      <div class="mt-6 flex flex-col">
        <div class="-m-1.5 overflow-x-auto">
          <div class="inline-block min-w-full p-1.5 align-middle">
            <div class="overflow-hidden rounded-lg border">
              <div class="overflow-x-auto shadow-md sm:rounded-lg">
                <h3 class="text-left ml-8 my-2 font-medium text-purple-800">Reason:</h3>
                <select
                    [(ngModel)]="selectedReason"
                    class="block w-5/6 mx-8 mb-4 rounded-lg border border-gray-300 bg-gray-50 p-3 pl-10 text-sm text-gray-900 focus:border-purple-500 focus:ring-purple-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-purple-500 dark:focus:ring-purple-500 sm:rounded-none sm:rounded-l-lg sm:rounded-r-lg"
                    placeholder="Enter your reason"
                    >
                    <option
                        
                    >
                       
                    </option>
                </select>
                <!-- <textarea 
                    class="rounded-lg"
                    cols="40" rows="3"
                    placeholder="Enter your reason"
                    [(ngModel)]="reason"
                    ></textarea> -->
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-8 flex justify-end gap-3">
        <div>
            <button
              type="submit"
              [disabled]="!selectedReason"
              [ngClass]="{ 'opacity-50 cursor-no-drop': !selectedReason}"
              class="w-full cursor-pointer rounded-lg border border-purple-600 bg-purple-500 px-5 py-3 text-center text-sm font-medium text-white hover:bg-purple-600 focus:ring-4 focus:ring-purple-300 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-800 sm:rounded-none sm:rounded-e-lg sm:rounded-s-lg"
            >
              Save
            </button>
          </div>
      </div>
      
    </div>
  </div>
</div>
