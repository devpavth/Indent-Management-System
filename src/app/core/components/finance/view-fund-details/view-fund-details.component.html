<div
  class="fixed bottom-0 left-0 right-0 top-0 z-20 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-black bg-opacity-50 backdrop-blur-sm"
>
  <div class="relative h-full w-full max-w-lg p-4 md:h-auto">
    <!-- Modal content -->
    <div
      class="animate__animated animate__bounceIn animate__faster relative rounded-lg bg-white p-4 text-center shadow dark:bg-gray-800 sm:p-5"
      >
      <div class="mr-4 mt-6">
        <h1 class="text-xl font-semibold text-purple-800">{{donarName}} Fund Details</h1>
      </div>
      <button
        (click)="closePopUp()"
        type="button"
        class="absolute right-2.5 top-2.5 ml-auto inline-flex items-center rounded-lg bg-transparent p-1.5 text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
        data-modal-toggle="successModal"
      >
        <svg
          aria-hidden="true"
          class="h-5 w-5"
          fill="currentColor"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          ></path>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
      <div class="mt-6 flex flex-col">
        <div class="-m-1.5 overflow-x-auto">
          <div class="inline-block min-w-full p-1.5 align-middle">
            <div class="overflow-hidden rounded-lg border">
              <div class="overflow-x-auto shadow-md sm:rounded-lg">
                <table
                  class="w-full text-left text-sm text-gray-500 dark:text-gray-400 rtl:text-right"
                >
                  <thead
                    class="bg-purple-500 text-xs uppercase text-gray-50 dark:bg-gray-700 dark:text-gray-400"
                  >
                    <tr>
                        <th class="px-3 py-3">Choose One Branch</th>
                      <th scope="col" class="px-6 py-3">Branch</th>
                      <th scope="col" class="px-6 py-3">
                        Funder Amount
                      </th>
                      <!-- <th scope="col" class="px-6 py-3">Qty</th> -->
                      <!-- <th scope="col" class="px-6 py-3">GST %</th>
                      <th scope="col" class="px-6 py-3">
                        Item Price(Incl GST)
                      </th> -->
                      <!-- <th
                        *ngIf="isAccept"
                        scope="col"
                        class="px-6 py-3"
                      >
                        Action
                      </th> -->
                    </tr>
                  </thead>
                  <tbody>
                    <tr
                        *ngFor="let fun of funder"
                      class="border-b bg-white hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:hover:bg-gray-600"
                    >   
                        <td class="px-3 py-4">
                            <input type="checkbox"
                                (change)="toggleCheckBox(fun.fundId)" 
                                [checked]="selectedFunderId === fun.fundId"
                                (click)="checkAmt(fun.fundInHand, $event)"
                                
                                />
                        </td>
                      <td
                        class="px-6 py-4 font-semibold text-gray-900 dark:text-white"
                      >
                        <p class="font-bold text-black">
                          {{fun.branchName
                          }}
                        </p>
                        <!-- <p class="text-gray-800"></p> -->
                        <!-- <p class="w-48 text-xs text-gray-400">
                          {{ fun?.fundInHand }}
                        </p> -->
                      </td>
                      <td class="px-6 py-4 dark:text-white">
                        <div *ngIf="selectedFunderId === fun.fundId; else viewMode">
                            <input type="number"
                                [(ngModel)]="fun.enteredAmount"
                                (ngModelChange)="validateAmount(fun)"
                                [ngClass]="{
                                    'border-none focus:ring-red-500': fun.isInvalid,
                                    'border-gray-300 focus:ring-primary-400': !fun.isInvalid
                                }"
                                class="focus:ring focus:outline-none border rounded px-2 py-1 w-full"
                            />
                            <span *ngIf="fun.enteredAmount > fun.fundInHand"
                                class="text-red-500 text-sm"> 
                                {{ fun?.fundInHand }}
                            </span>
                            <p *ngIf="fun.enteredAmount <= fun.fundInHand"
                                class="mt-1 -mb-2 text-sm font-medium text-gray-600">
                                {{ fun?.fundInHand }}
                            </p>
                        </div>
                        <ng-template #viewMode>
                            {{ fun?.fundInHand }}
                        </ng-template>
                      </td>
                      <!-- <td class="px-6 py-4 dark:text-white">
                        {{ product?.qty }}
                      </td>
                      <td class="px-6 py-4 dark:text-white">
                        {{ product?.prdGstPct }}
                      </td> -->
                      <!-- <td class="px-6 py-4">
                        {{ product?.itemTotalPrice }}
                      </td> -->
                      <!-- <td *ngIf="isAccept" class="px-6 py-4">
                        <button
                          (click)="
                            productEdit(product);
                            this.isEditProduct = true
                          "
                        >
                          <svg
                            class="h-6 w-6 text-blue-600"
                            aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            fill="none"
                            viewBox="0 0 24 24"
                          >
                            <path
                              stroke="currentColor"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"
                            />
                          </svg>
                        </button>
                      </td> -->
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-8 flex justify-end gap-3">
        <div>
            <button
              type="submit"
              (click)="submit(selectedFunderId)"
              [disabled]="isAmtValid() || !isCheckBoxSelected()"
              [ngClass]="{ 'opacity-50 cursor-no-drop': isAmtValid() || !isCheckBoxSelected()}"
              class="w-full cursor-pointer rounded-lg border border-purple-600 bg-purple-500 px-5 py-3 text-center text-sm font-medium text-white hover:bg-purple-600 focus:ring-4 focus:ring-purple-300 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-800 sm:rounded-none sm:rounded-e-lg sm:rounded-s-lg"
            >
              Save
            </button>
          </div>
      </div>
      
    </div>
  </div>
</div>
<section
  *ngIf="isToast"
  class="fixed top-10 z-50 flex w-full items-center justify-center"
>
  <app-warning-toast [message]="warningToastMsg"></app-warning-toast>
</section>

<section *ngIf="isViewReasonBranch" class="absolute left-0 right-0 top-0 z-50 h-screen">
  <app-view-fundbranchreason
      [checkedFund]="checkedFunder"
     (close)="closeReason($event)"></app-view-fundbranchreason>
</section>
