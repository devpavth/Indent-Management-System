<div class="absolute top-12 left-4 right-0 z-50 w-4/5 bg-gradient-to-t from-gray-900 to-purple-950 p-8 sm:ml-64">
  <button class="fixed ml-24" (click)="closeView.emit(false)">
    <svg
      class="h-8 w-8 rounded-full bg-gray-100/5 p-1 text-gray-50 transition-all duration-500 hover:bg-red-600 hover:text-white dark:text-white"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        class=""
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M6 18 17.94 6M18 18 6.06 6"
      />
    </svg>
  </button>
  <section class="">
    <div class="mx-40">
      <div class="rounded-xl bg-white shadow-lg">
       
        <div class="items-center justify-between">
          <div class=" ">
            
            <div class="mx-auto">
                
              <!-- Card -->
              <div class="flex flex-col p-4 sm:p-10">
                <h2
                class="text-purple-600 text-xl font-semibold text-center mb-2"
                >Quote Comparison Sheet</h2>
                

                <div class="flex flex-row items-center">               
                    <label for=""
                        class="mt-6 text-lg font-bold text-purple-600"
                        >
                        INDENT ID:
                    </label>

                    <input
                        type="text"
                        class="ml-4 mt-4 rounded-lg text-center text-lg font-semibold"
                        [value]="indentNumber"
                        readonly
                    />
                </div>

                <div
                    class="flex flex-row items-center mt-6 space-y-3 md:flex-row md:space-x-4 md:space-y-0"
                    >
                    <label for=""
                        class="text-lg font-semibold text-purple-600"
                        >
                        Head of Account:
                    </label>
                    <select 
                        class="m-4 w-64 rounded-lg border border-gray-500"
                        (change)="selectedHeadOfAcc($event)"
                        [value]="selectedHeadOfAccId"
                        >
                        <option 
                            value="" disabled>Choose Head of Account</option>
                        <option 
                            *ngFor="let head of uniqueProductHeadData"
                            [value]="head.headOfAccId">
                            {{ head.headOfAccName }}
                        </option>
                    </select>

                    <div class="relative group">
                        <button 
                            type="submit"
                            *ngIf="isViewAcceptBtn && !isCompleted"
                            [disabled]="!signUploaded"
                            [ngClass]="{
                            'bg-green-300 hover:bg-green-300 border border-green-300': !signUploaded
                            }"
                            (click)="acceptSpecialApproval()"
                            class="flex flex-row items-center rounded-full text-white font-medium px-4 py-2 bg-green-500 gap-1 border border-green-500 hover:bg-green-600 relative"
                        >
                            <svg
                            class="h-6 w-6"
                            aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            fill="currentColor"
                            viewBox="0 0 24 24"
                            >
                            <path
                                fill-rule="evenodd"
                                d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm13.707-1.293a1 1 0 0 0-1.414-1.414L11 12.586l-1.793-1.793a1 1 0 0 0-1.414 1.414l2.5 2.5a1 1 0 0 0 1.414 0l4-4Z"
                                clip-rule="evenodd"
                            />
                            </svg>
                            Accept
                        </button>

                        <!-- Tooltip -->
                        <div 
                            *ngIf="!signUploaded"
                            class="absolute left-1/2 -top-[50%] z-10 min-w-[250px] -translate-x-1/2 rounded-lg bg-black px-3 py-2 text-sm text-white shadow-md opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                        >
                            Before accepting the indent request, you need to upload a signature
                        </div>
                    </div>

                </div>

                <div class="mt-8 relative">
                    <div *ngIf="isLoading" class="absolute mt-2 inset-0 flex items-center justify-center bg-white bg-opacity-70">
                        <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <iframe *ngIf="!isLoading && pdfURL" [src]="pdfURL" width="100%" height="700px"></iframe>
                </div>
            
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  
</div>
<section *ngIf="isApproved" class="absolute left-0 right-0 top-0 z-50 h-screen">
  <app-success-pop (close)="closepop($event)"></app-success-pop>
</section>
