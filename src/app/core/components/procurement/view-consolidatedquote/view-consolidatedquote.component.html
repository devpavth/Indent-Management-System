<div class="fixed top-0 left-0 right-0 bg-gradient-to-t from-gray-900 to-purple-950 p-16 sm:ml-64">
    <button class="fixed top-20 right-6" (click)="closeView.emit(false)">
        <svg
        class="h-8 w-8 rounded-full bg-gray-100/5 p-1 text-gray-50 transition-all duration-500 hover:bg-red-600 hover:text-white dark:text-white"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
        >
        <path
            class=""
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18 17.94 6M18 18 6.06 6"
        />
        </svg>
    </button>
    <!-- <div class="mt-12 h-screen">
        <iframe *ngIf="pdfUrl" [src]="pdfUrl" width="100%" height="700px"></iframe>
    </div> -->

    <div class="mt-8 relative h-screen">
        <div *ngIf="isLoading" class="absolute mt-2 inset-0 flex items-center justify-center bg-white bg-opacity-70">
            <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <iframe *ngIf="!isLoading && pdfUrl" [src]="pdfUrl" width="100%" height="700px"></iframe>
    </div>

</div>
