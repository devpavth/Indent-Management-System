<div class="p-4 sm:ml-64">
    <div class="px-2 py-2">
        <h1 class="font-semibold text-purple-800">Purchase Order List</h1>
    </div>
    <section class="dark:bg-gray-900">
        <div class="mx-auto">
            <div class="relative overflow-hidden bg-white shadow-md shadow-purple-300 dark:bg-gray-800 sm:rounded-lg">
                <div class="flex flex-col items-center justify-between space-y-3 p-4 md:flex-row md:space-x-4 md:space-y-0">
                    <div class="w-full md:w-1/2">
                        <div class="flex items-center">
                            <label for="simple-search" class="sr-only">Search</label>
                            <div class="relative w-full -mt-10">
                                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                                    <svg
                                        aria-hidden="true"
                                        class="h-5 w-5 text-gray-500 dark:text-gray-400"
                                        fill="currentColor"
                                        viewbox="0 0 20 20"
                                        xmlns="http://www.w3.org/2000/svg"
                                        >
                                        <path
                                        fill-rule="evenodd"
                                        d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                                        clip-rule="evenodd"
                                        />
                                    </svg>
                                </div>
                                <input 
                                    type="text"
                                    class="focus:ring-primary-500 focus:border-primary-500 dark:focus:ring-primary-500 dark:focus:border-primary-500 block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 pl-10 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                    placeholder="Search"
                                />
                            </div>
                        </div>
                    </div>
                    <div
                        class="flex flex-col w-full flex-shrink-0 justify-end space-y-2 md:w-auto md:flex-row md:items-center md:space-x-3 md:space-y-0"
                        >
                        <mat-form-field>
                            <mat-label>Enter a date range</mat-label>
                            <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
                            <input matStartDate formControlName="start" placeholder="Start date">
                            <input matEndDate formControlName="end" placeholder="End date">
                            </mat-date-range-input>
                            <mat-hint>MM/DD/YYYY – MM/DD/YYYY</mat-hint>
                            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-date-range-picker #picker></mat-date-range-picker>
                        
                            @if (range.controls.start.hasError('matStartDateInvalid')) {
                            <mat-error>Invalid start date</mat-error>
                            }
                            @if (range.controls.end.hasError('matEndDateInvalid')) {
                            <mat-error>Invalid end date</mat-error>
                            }
                        </mat-form-field>
  
  <!-- <p>Selected range: {{range.value | json}}</p> -->
  
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
