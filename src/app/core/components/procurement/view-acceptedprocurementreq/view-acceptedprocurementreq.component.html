<div class="absolute top-12 left-4 right-0 z-50 w-4/5 bg-gradient-to-t from-gray-900 to-purple-950 p-8 sm:ml-64">

        stroke-linecap="round"

        stroke-width="2"
        d="M6 18 17.94 6M18 18 6.06 6"

              <!-- Card -->
              <div class="flex flex-col p-4 sm:p-10">

                <div class="flex flex-row items-center">               
                    <label for=""
                        class="mt-6 text-lg font-bold text-purple-600"
                        >
                        INDENT ID:
                    </label>

                    <input
                        type="text"
                        class="ml-4 mt-4 rounded-lg text-center text-lg font-semibold"
                        [value]="indentNumber"
                        readonly
                    />
                </div>

                <div
                    class="flex flex-row items-center mt-6 space-y-3 md:flex-row md:space-x-4 md:space-y-0"
                    >
                    <label for=""
                        class="text-lg font-semibold text-purple-600"
                        >
                        Head of Account:
                    </label>
                    <select 
                        class="m-4 w-64 rounded-lg border border-gray-500"
                        (change)="selectedHeadOfAcc($event)"
                        [value]="selectedHeadOfAccId"
                        >
                        <option 
                            value="" disabled>Choose Head of Account</option>
                        <option 
                            *ngFor="let head of uniqueProductHeadData"
                            [value]="head.headOfAccId">
                            {{ head.headOfAccName }}
                        </option>
                    </select>
                </div>

                <div class="mt-8 relative">
                    <div *ngIf="isLoading" class="absolute mt-2 inset-0 flex items-center justify-center bg-white bg-opacity-70">
                        <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <iframe *ngIf="!isLoading && pdfURL" [src]="pdfURL" width="100%" height="700px"></iframe>
                </div>
