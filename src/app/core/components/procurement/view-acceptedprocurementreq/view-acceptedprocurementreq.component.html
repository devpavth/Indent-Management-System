<div class="absolute top-12 left-4 right-0 z-50 w-4/5 bg-gradient-to-t from-gray-900 to-purple-950 p-8 sm:ml-64 print-content">
  <button class="fixed ml-24" (click)="closeView.emit(false)">
    <svg
      class="h-8 w-8 rounded-full bg-gray-100/5 p-1 text-gray-50 transition-all duration-500 hover:bg-red-600 hover:text-white dark:text-white"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        class=""
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M6 18 17.94 6M18 18 6.06 6"
      />
    </svg>
  </button>
  <section class="">
    <div class="mx-40">
      <div class="rounded-xl bg-white shadow-lg">
       
        <div class="items-center justify-between">
          <div class=" ">
            <div class="mx-auto">
              <!-- Card -->
              <div class="flex flex-col p-4 sm:p-10">
                <!-- Grid -->
                <div class="flex justify-between">
                  <div>
                    <img
                      src="../../../../../assets/Img/logo_apd.png"
                      alt=""
                      class="h-32"
                    />       
                  </div>

                </div>

                <div class="flex flex-row items-center">               
                    <label for=""
                        class="mt-6 text-lg font-bold text-purple-600"
                        >
                        INDENT ID:
                    </label>

                    <input
                        type="text"
                        class="ml-4 mt-4 rounded-lg text-center text-lg font-semibold"
                        [value]="indentNumber"
                        readonly
                    />
                </div>

                <div
                    class="flex flex-row items-center mt-6 space-y-3 md:flex-row md:space-x-4 md:space-y-0"
                    >
                    <label for=""
                        class="text-lg font-semibold text-purple-600"
                        >
                        Head of Account:
                    </label>
                    <select 
                        class="m-4 w-64 rounded-lg border border-gray-500"
                        (change)="selectedHeadOfAcc($event)"
                        >
                        <option 
                            value="" disabled>Choose Head of Account</option>
                        <option 
                            *ngFor="let head of uniqueProductHeadData"
                            [value]="head.headOfAccId">
                            {{ head.headOfAccName }}
                        </option>
                    </select>
                </div>

                <!-- Table -->
                <div class="mt-6 flex flex-col">
                  <div class="-m-1.5 overflow-x-auto">
                    <div class="inline-block min-w-full p-1.5 align-middle"
                        *ngIf="filterProductHeadData.length > 0"
                        >
                      <div class="overflow-hidden rounded-lg border">
                        <div class="overflow-x-auto shadow-md sm:rounded-lg"
                            >
                          <table
                            class="w-full text-left text-sm text-gray-500 dark:text-gray-400 rtl:text-right"
                          >
                            <thead
                              class="bg-purple-500 text-xs uppercase text-gray-50 dark:bg-gray-700 dark:text-gray-400"
                            >
                              <tr>
                                <th scope="col" class="px-6 py-3">Product</th>
                                <th scope="col" class="px-6 py-3">
                                  Cloute Technologies Pvt. Ltd.
                                </th>
                                <th scope="col" class="px-6 py-3">Bright Technology</th>
                                <th scope="col" class="px-6 py-3">NextGen</th>
                                <!-- <th scope="col" class="px-6 py-3">
                                  Item Price(Incl GST)
                                </th> -->
                                <!-- <th
                                  *ngIf="isAccept"
                                  scope="col"
                                  class="px-6 py-3"
                                >
                                  Action
                                </th> -->
                              </tr>
                            </thead>
                            <tbody>
                              <tr
                                *ngFor="
                                  let product of filterProductHeadData
                                "
                                class="border-b bg-white hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:hover:bg-gray-600"
                              >
                                <td
                                  class="px-6 py-4 font-semibold text-gray-900 dark:text-white"
                                >
                                    <p class="font-bold text-black">
                                        {{ product.prdmdlName }}
                                    </p>
                                    <p class="text-gray-800">
                                        {{ product.prdbrndName }} | HoA -
                                        {{ product.headOfAccName }}
                                    </p>
                                    <p class="w-48 text-xs text-gray-400">
                                        {{ product.prdDescription }}
                                    </p>
                                </td>
                                <!-- <td class="px-6 py-4 dark:text-white">
                                  {{ product?.unitPrice | currency: "INR" }}
                                </td>
                                <td class="px-6 py-4 dark:text-white">
                                  {{ product?.qty }}
                                </td>
                                <td class="px-6 py-4 dark:text-white">
                                  {{ product?.prdGstPct }}
                                </td>
                                <td class="px-6 py-4">
                                  {{ product?.itemTotalPrice }}
                                </td> -->
                                <!-- <td *ngIf="isAccept" class="px-6 py-4">
                                  <button
                                    (click)="
                                      productEdit(product);
                                      this.isEditProduct = true
                                    "
                                  >
                                    <svg
                                      class="h-6 w-6 text-blue-600"
                                      aria-hidden="true"
                                      xmlns="http://www.w3.org/2000/svg"
                                      width="24"
                                      height="24"
                                      fill="none"
                                      viewBox="0 0 24 24"
                                    >
                                      <path
                                        stroke="currentColor"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"
                                      />
                                    </svg>
                                  </button>
                                </td> -->
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- End Table -->

                <!-- Flex -->
                <div class="mt-8 flex sm:justify-end" *ngIf="filterProductHeadData.length > 0">
                  <div class="w-full max-w-2xl space-y-2 sm:text-end">
                    <!-- Grid -->
                    <div class="grid grid-cols-2 gap-3 sm:grid-cols-1 sm:gap-2">

                      <dl class="grid gap-x-0 gap-y-1 sm:grid-cols-5">
                        <dt class="col-span-2 font-semibold text-gray-800">
                          Least Vendor Total:
                        </dt>
                        <dd class="col-span-3 text-gray-500"></dd>
                        <dt class="col-span-2 font-semibold text-gray-800">
                          Indent Total:
                        </dt>
                        
                        <dd class="col-span-3 text-gray-500">
                          {{
                            this._requestDetails()?.indentHeaders?.totalPrice
                              | currency: "INR"
                          }}
                        </dd>
                      </dl>
                    </div>
                  </div>
                </div>

                
                <button 
                    class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 print-hidden"
                    (click)="printPage()">
                    Print
                </button>

                
      
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
