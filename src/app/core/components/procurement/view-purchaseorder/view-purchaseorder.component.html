<div
  class="py- fixed left-0 right-0 top-0 bg-gradient-to-t from-gray-900 to-purple-950 sm:ml-64"
>
  <button class="fixed right-12 top-20" (click)="closeView.emit(false)">
    <svg
      class="h-8 w-8 rounded-full bg-gray-100/5 p-1 text-gray-50 transition-all duration-500 hover:bg-red-600 hover:text-white dark:text-white"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        class=""
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M6 18 17.94 6M18 18 6.06 6"
      />
    </svg>
  </button>
  <section class="scroll mt-16 h-screen overflow-auto">
    <div class="mx-40">
      <div
        *ngIf="isLoading"
        class="absolute inset-0 mt-2 flex items-center justify-center bg-opacity-70"
      >
        <div
          class="h-12 w-12 animate-spin rounded-full border-4 border-purple-500 border-t-transparent"
        ></div>
      </div>
      <div class="mt-10 rounded-xl bg-white shadow-lg" *ngIf="!isLoading">
        <div class="items-center justify-between">
          <div>
            <div class="mx-auto">
              <!-- Card -->
              <div class="flex flex-col p-4 sm:p-10">
                <!-- Grid -->
                <h2
                  class="-mt-4 mb-2 text-center text-xl font-bold text-purple-600"
                >
                  Purchase Order
                </h2>

                <div class="relative mt-1">
                  <iframe
                    *ngIf="pdfURL"
                    [src]="pdfURL"
                    width="100%"
                    height="700px"
                  ></iframe>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<section
  *ngIf="toastService.isErrorToast"
  class="fixed top-10 z-50 flex w-full items-center justify-center"
>
  <app-delete-toast [message]="toastService.errorToastMsg"></app-delete-toast>
</section>
<section
  *ngIf="toastService.isWarningToast"
  class="fixed top-10 z-50 flex w-full items-center justify-center"
>
  <app-warning-toast
    [message]="toastService.warningToastMsg"
  ></app-warning-toast>
</section>
