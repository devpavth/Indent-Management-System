<section class="">
  <div class="p-4 sm:ml-64">
    <section class="dark:bg-gray-900">
      <div class="mx-auto">
        <div
          class="overflow-hidden bg-white shadow-md shadow-purple-300 dark:bg-gray-800 sm:rounded-lg"
            >
            <h2
                class="font-bold text-lg text-center m-4 text-purple-500"
             >Stock Report</h2>

             <div class="grid grid-cols-3 -mb-4 gap-6 px-6">
                <label class="text-purple-500 text-md font-semibold">Select Branch</label>
                <label class="text-purple-500 text-md font-semibold">From</label>
                <label class="text-purple-500 text-md font-semibold">To</label>
             </div>
             

             <div class="grid grid-cols-3 gap-6 p-6">
                <select
                    class="w-full text-md text-gray-700 rounded-lg border border-gray-400"
                    (change)="selectedBranch($event)">
                    <option value="" disabled>Choose Branch</option>
                    <option *ngFor="let branch of branchList" [value]="branch.branchId">
                    {{ branch.branchName }}
                    </option>
                </select>

                <input
                    type="date"
                    [(ngModel)]="startDate"
                    name="startDate"
                    class="input-form w-full"
                    required
                />

                <div class="flex gap-2">
                    <input
                    type="date"
                    [(ngModel)]="endDate"
                    [max]="maxDate"
                    name="endDate"
                    class="input-form w-full"
                    required
                    />
                    
                </div>

                
            </div>

            <div class="flex justify-end mr-6 mb-4">
                <button
                    type="button"
                    (click)="onSubmit(startDate, endDate)"
                    [disabled]="!startDate || !endDate || selectedBranchId < 0"
                    [ngClass]="{
                        'bg-gray-400 hover:bg-gray-400': !startDate || !endDate || selectedBranchId < 0
                    }"
                    class="rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500"
                    >
                    Generate PDF
                </button>
            </div>
