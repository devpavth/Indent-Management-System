<section class="">
  <div class="p-4 sm:ml-64">
    <section class="dark:bg-gray-900">
      <div class="mx-auto">
        <div
          class="overflow-hidden bg-white shadow-md shadow-purple-300 dark:bg-gray-800 sm:rounded-lg"
        >
          <h2 class="m-4 text-center text-lg font-bold text-purple-500">
            Stock Report
          </h2>

          <div class="-mb-4 grid grid-cols-3 gap-6 px-6">
            <label class="text-md font-semibold text-purple-500"
              >Select Branch</label
            >
            <label class="text-md font-semibold text-purple-500">From</label>
            <label class="text-md font-semibold text-purple-500">To</label>
          </div>

          <div class="grid grid-cols-3 gap-6 p-6">
            <select
              class="text-md w-full rounded-lg border border-gray-400 text-gray-700"
              (change)="selectedBranch($event)"
              >
              <option value="" disabled>Choose Branch</option>
              <option
                *ngFor="let branch of branchList"
                [value]="branch.branchId"
              >
                {{ branch.branchName }}
              </option>
            </select>

            <input
              type="date"
              [(ngModel)]="startDate"
              (ngModelChange)="resetEndDate()"
              name="startDate"
              class="input-form w-full"
              required
            />

            <div class="flex gap-2">
              <input
                type="date"
                [(ngModel)]="endDate"
                [min]="startDate"
                [max]="maxDate"
                name="endDate"
                class="input-form w-full"
                required
              />
            </div>
          </div>

          <div class="mb-4 mr-6 flex justify-end">
            <button
              type="button"
              (click)="onSubmit(startDate, endDate)"
              [disabled]="!startDate || !endDate || selectedBranchId < 0"
              [ngClass]="{
                'bg-gray-400 hover:bg-gray-400':
                  !startDate || !endDate || selectedBranchId < 0
              }"
              class="rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500"
            >
              Generate PDF
            </button>
          </div>

          <div class="relative">
            <div
              *ngIf="isLoading"
              class="absolute inset-0 -mt-10 flex items-center justify-center"
            >
              <div
                class="h-8 w-8 animate-spin rounded-full border-4 border-purple-500 border-t-transparent"
              ></div>
            </div>
            <iframe
              *ngIf="!isLoading && pdfUrl"
              [src]="pdfUrl"
              width="100%"
              height="700px"
            ></iframe>
          </div>
        </div>
      </div>
    </section>
  </div>
</section>
