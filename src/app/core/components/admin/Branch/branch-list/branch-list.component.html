<section *ngIf="isSuccess">
  <app-success-for-branch
    (closeSuccessPop)="closeSuccessPop($event)"
  ></app-success-for-branch>
</section>
<section class="">
  <div
    *ngIf="isViewBranch"
    class="animate__animated animate__fadeIn animate__faster absolute left-0 right-0 z-20"
  >
    <app-view-branch
      (closeViewBranch)="closeViewBranch($event)"
      (closeSuccess)="closeSuccessPop($event)"
      [getBranchCode]="branchCode"
    ></app-view-branch>
  </div>
  <div class="p-4 sm:ml-64">
    <section class="dark:bg-gray-900">
      <div class="mx-auto">
        <div
          class="relative overflow-hidden bg-white shadow-md shadow-purple-300 dark:bg-gray-800 sm:rounded-lg"
        >
          <div
            class="flex flex-col items-center justify-between space-y-3 p-4 md:flex-row md:space-x-4 md:space-y-0"
          >
            <div class="w-full md:w-1/2">
              <div class="flex items-center">
                <label for="simple-search" class="sr-only">Search</label>
                <div class="relative w-full">
                  <div
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
                  >
                    <svg
                      aria-hidden="true"
                      class="h-5 w-5 text-gray-500 dark:text-gray-400"
                      fill="currentColor"
                      viewbox="0 0 20 20"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                        clip-rule="evenodd"
                      />
                    </svg>
                  </div>
                  <input
                    type="text"
                    class="focus:ring-primary-500 focus:border-primary-500 dark:focus:ring-primary-500 dark:focus:border-primary-500 block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 pl-10 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400"
                    placeholder="Search"
                  />
                </div>
              </div>
            </div>
            <div
              class="flex w-full flex-shrink-0 flex-col items-stretch justify-end space-y-2 md:w-auto md:flex-row md:items-center md:space-x-3 md:space-y-0"
            >
              <button
                type="button"
                routerLink="/home/addBranch"
                class="flex items-center justify-center rounded-lg bg-purple-700 px-4 py-2 text-sm font-medium text-white hover:bg-purple-800 focus:outline-none focus:ring-4 focus:ring-purple-300 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-800"
              >
                <svg
                  class="mr-2 h-4 w-4"
                  fill="currentColor"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="3"
                    d="M5 12h14m-7 7V5"
                  />
                </svg>

                Add branch
              </button>
            </div>
          </div>
          <div class="overflow-x-auto" #test>
            <table
              class="w-full text-left text-sm text-gray-500 dark:text-gray-400"
            >
              <thead
                class="bg-purple-50 text-xs uppercase text-purple-900 dark:bg-gray-700 dark:text-gray-400"
              >
                <tr>
                  <th scope="col" class="px-4 py-3">S.no</th>
                  <th scope="col" class="px-4 py-3">
                    <div class="flex items-center justify-between">
                      <div>Branch ID</div>
                      <button
                        class="an rounded-full hover:bg-gray-600 hover:text-white"
                      >
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke-width="1.5"
                          stroke="currentColor"
                          class="h-4 w-4"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M8.25 15 12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"
                          />
                        </svg>
                      </button>
                    </div>
                  </th>
                  <th scope="col" class="px-4 py-3">
                    <div class="flex items-center justify-between">
                      <div>Name</div>
                      <button
                        class="an rounded-full hover:bg-gray-600 hover:text-white"
                      >
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke-width="1.5"
                          stroke="currentColor"
                          class="h-4 w-4"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M8.25 15 12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"
                          />
                        </svg>
                      </button>
                    </div>
                  </th>

                  <th scope="col" class="px-4 py-3">Manager</th>
                  <th scope="col" class="px-4 py-3">City</th>

                  <th scope="col" class="px-4 py-3">
                    <span class="sr-only">Actions</span>
                  </th>
                </tr>
              </thead>
              <tbody *ngIf="!isSkeletonLoader">
                <tr
                  class="border-b transition-all duration-300 hover:bg-gray-50 hover:text-gray-900 dark:border-gray-700"
                  *ngFor="let bch of _branch; let i = index"
                >
                  <td class="px-4 py-3">{{ i + 1 }}</td>
                  <th
                    scope="row"
                    class="whitespace-nowrap px-4 py-3 font-medium text-gray-900 dark:text-white"
                  >
                    {{ bch.branchCode }}
                  </th>
                  <td class="px-4 py-3">{{ bch.branchName }}</td>

                  <td class="px-4 py-3">{{ bch.manager }}</td>
                  <td class="px-4 py-3">{{ bch.city }}</td>

                  <td class="flex items-center justify-end px-4 py-3">
                    <button
                      (click)="viewBranch(bch.branchCode)"
                      class="inline-flex items-center rounded-lg p-0.5 text-center text-sm font-medium text-gray-500 hover:text-gray-800 focus:outline-none dark:text-gray-400 dark:hover:text-gray-100"
                      type="button"
                    >
                      <svg
                        class="h-5 w-5"
                        aria-hidden="true"
                        fill="currentColor"
                        viewbox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z"
                        />
                      </svg>
                    </button>
                  </td>
                </tr>
              </tbody>

              <tbody *ngIf="isSkeletonLoader">
                <tr
                  *ngFor="let _ of [1, 2, 3, 4, 5]"
                  class="animate-pulse border-b"
                >
                  <td class="px-4 py-3">
                    <div class="h-5 w-8 rounded-xl bg-gray-300"></div>
                  </td>
                  <td class="px-4 py-3">
                    <div class="h-5 w-16 rounded-xl bg-gray-300"></div>
                  </td>
                  <td class="px-4 py-3">
                    <div class="h-5 w-24 rounded-xl bg-gray-300"></div>
                  </td>
                  <td class="px-4 py-3">
                    <div class="h-5 w-28 rounded-xl bg-gray-300"></div>
                  </td>
                  <td class="px-4 py-3">
                    <div class="h-5 w-44 rounded-xl bg-gray-300"></div>
                  </td>
                  <td class="px-4 py-3">
                    <div class="h-5 w-10 rounded-xl bg-gray-300"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
</section>
<section *ngIf="isAuth">
  <div class="fixed left-0 right-0 top-0 h-screen sm:ml-64">
    <app-unauthorized></app-unauthorized>
  </div>
</section>
