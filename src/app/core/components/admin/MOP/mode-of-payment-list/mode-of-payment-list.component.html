<ng-container>
    <div class="p-4 sm:ml-64">
        <div class="dark:bg-gray-900">
            <div class="bg-white shadow-md shadow-purple-300 overflow-hidden sm:rounded-lg">
                <div class="flex items-center justify-between p-4">
                    <h3 class="text-purple-800 font-semibold">Mode Of Payment</h3>
                    <button 
                        (click)="addModeOfPayment()"
                        class="inline-flex items-center bg-purple-700 text-white font-medium px-3 py-1.5 rounded-lg hover:bg-purple-800">
                        <svg
                            class="mr-2 h-4 w-4"
                            fill="currentColor"
                            aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            fill="none"
                            viewBox="0 0 24 24"
                            >
                            <path
                                stroke="currentColor"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="3"
                                d="M5 12h14m-7 7V5"
                            />
                        </svg>
                        Add Mode of Payment
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-purple-50 text-purple-800 uppercase text-xs">
                            <tr>
                                <th scope="col" class="px-4 py-3">S.NO</th>
                                <th scope="col" class="px-4 py-3">Mode of Payment</th>
                                <th scope="col" class="px-4 py-3">
                                    <span class="sr-only">Actions</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody *ngIf="!isSkeletonLoader">
                            <tr *ngFor="let payment of modeOfPaymentList; let i = index"
                                class="border-b hover:bg-gray-50 hover:text-gray-900 text-left"
                                >
                                <td class="px-4 py-3">{{ i + 1}}</td>
                                <td class="px-4 py-3">{{ payment.modeOfPayment }}</td>
                                <td class="flex items-center justify-end gap-4 px-4 py-3">
                                    <button
                                        (click)="updateModeOfPayment(payment.id, payment.modeOfPayment)"
                                        class="group bg-blue-50 rounded-full p-1 hover:bg-blue-500"
                                        >
                                        <svg
                                            class="h-5 w-5 text-blue-600 group-hover:text-blue-50"
                                            aria-hidden="true"
                                            xmlns="http://www.w3.org/2000/svg"
                                            width="24"
                                            height="24"
                                            fill="currentColor"
                                            viewBox="0 0 24 24"
                                            >
                                            <path
                                                fill-rule="evenodd"
                                                d="M11.32 6.176H5c-1.105 0-2 .949-2 2.118v10.588C3 20.052 3.895 21 5 21h11c1.105 0 2-.948 2-2.118v-7.75l-3.914 4.144A2.46 2.46 0 0 1 12.81 16l-2.681.568c-1.75.37-3.292-1.263-2.942-3.115l.536-2.839c.097-.512.335-.983.684-1.352l2.914-3.086Z"
                                                clip-rule="evenodd"
                                            />
                                            <path
                                                fill-rule="evenodd"
                                                d="M19.846 4.318a2.148 2.148 0 0 0-.437-.692 2.014 2.014 0 0 0-.654-.463 1.92 1.92 0 0 0-1.544 0 2.014 2.014 0 0 0-.654.463l-.546.578 2.852 3.02.546-.579a2.14 2.14 0 0 0 .437-.692 2.244 2.244 0 0 0 0-1.635ZM17.45 8.721 14.597 5.7 9.82 10.76a.54.54 0 0 0-.137.27l-.536 2.84c-.07.37.239.696.588.622l2.682-.567a.492.492 0 0 0 .255-.145l4.778-5.06Z"
                                                clip-rule="evenodd"
                                            />
                                        </svg>
                                    </button>
                                    <button
                                        (click)="toggleDelete(1, payment.id, true)"
                                        class="group bg-red-50 hover:bg-red-500 rounded-full p-1"
                                        >
                                        <svg
                                            class="h-5 w-5 text-red-600 group-hover:text-red-50 dark:text-white"
                                            aria-hidden="true"
                                            xmlns="http://www.w3.org/2000/svg"
                                            width="24"
                                            height="24"
                                            fill="currentColor"
                                            viewBox="0 0 24 24"
                                            >
                                            <path
                                                fill-rule="evenodd"
                                                d="M8.586 2.586A2 2 0 0 1 10 2h4a2 2 0 0 1 2 2v2h3a1 1 0 1 1 0 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a1 1 0 0 1 0-2h3V4a2 2 0 0 1 .586-1.414ZM10 6h4V4h-4v2Zm1 4a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Zm4 0a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Z"
                                                clip-rule="evenodd"
                                            />
                                        </svg>
                                    </button>
                                </td>
                            </tr>
                        </tbody>

                        <tbody *ngIf="isSkeletonLoader">
                            <tr *ngFor="let _ of [1,2,3,4,5]" class="border-b animate-pulse">
                                <td class="px-4 py-3"><div class="w-8 h-5 bg-gray-300 rounded-lg"></div></td>
                                <td class="px-4 py-3"><div class="w-32 h-5 bg-gray-300 rounded-lg"></div></td>
                                <td class="flex justify-end gap-4 px-4 py-3">
                                    <div class="w-7 h-7 bg-gray-300 rounded-full"></div>
                                    <div class="w-7 h-7 bg-gray-300 rounded-full"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <ng-container *ngIf="noModeOfPayment">
                    <div class="flex items-center justify-center rounded-lg bg-white h-96 px-4">
                        <div class="text-center">
                            <img
                                src="../../../../../assets/Img/9264882.svg"
                                class="mx-auto w-52"
                                alt="No data available"
                            />
                            <p class="mt-4 text-gray-800 font-medium dark:text-gray-700">
                                No Mode Of Payment available
                            </p>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>   
</ng-container>

<ng-container *ngIf="isAddModeOfPaymentModal">
    <app-add-mode-of-payment 
        [initialModeOfPayment]="modeOfPayment"
        [modeOfPaymentId]="modeOfPaymentId"
        (closeAddMOPModal)="closeAddMOPModal($event)">
    </app-add-mode-of-payment>
</ng-container>

<ng-container *ngIf="isDelete">
    <app-delete
    [deleteData]="deleteProduct"
    (close)="toggleDelete(0, 0, $event)"
    ></app-delete>
</ng-container>
