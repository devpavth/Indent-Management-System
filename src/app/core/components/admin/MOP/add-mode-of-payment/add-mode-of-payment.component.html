<ng-container>
    <div class="fixed top-0 bottom-0 left-0 right-0 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm">
        <div class="w-full h-full max-w-lg md:h-auto">
            <div class="bg-white p-3 rounded-lg shadow">
                <div class="flex items-center justify-between">
                    <button
                        (click)="closeAddMOPModal.emit(false)"
                        class="ml-auto text-gray-500 p-1.5 rounded-full hover:bg-gray-200"
                        >
                        <svg
                            aria-hidden="true"
                            class="h-5 w-5"
                            fill="currentColor"
                            viewBox="0 0 20 20"
                            xmlns="http://www.w3.org/2000/svg"
                            >
                            <path
                            fill-rule="evenodd"
                            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                            clip-rule="evenodd"
                            ></path>
                        </svg>
                    </button>
                </div>
                <form [formGroup]="addModeOfPaymentForm">
                    <div class="grid p-2">
                        <label
                            class="text-purple-600 text-lg font-medium"
                            >
                            {{ initialModeOfPayment? 'Update Mode Of Payment' : 'Add Mode Of Payment'}}
                        </label>
                        <input 
                            (input)="checkModeOfPayment($event)"
                            type="text"
                            placeholder="Enter Mode of Payment"
                            formControlName="modeOfPayment"
                            maxlength="80"
                            class="rounded-lg mt-1"
                            [value]="initialModeOfPayment"
                        />
                    </div>
                </form>
                <div class="flex justify-end p-2">
                    <button
                        [disabled]="addModeOfPaymentForm.invalid || !isEnableSubmitBtn"
                        [ngClass]="{
                            'bg-slate-400 hover:bg-slate-400': addModeOfPaymentForm.invalid || !isEnableSubmitBtn
                        }"
                        (click)="submitModeOfPayment(addModeOfPaymentForm.value)"
                        class="bg-purple-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-purple-700"
                        >
                        Submit
                    </button>
                </div>
            </div>
        </div>
    </div>
</ng-container>

<ng-container *ngIf="toastService.isSuccessToast">
    <div class="fixed flex items-center justify-center w-full top-10">
        <app-success-toast [message]="toastService.successToastMsg">     
        </app-success-toast>
    </div>
</ng-container>
