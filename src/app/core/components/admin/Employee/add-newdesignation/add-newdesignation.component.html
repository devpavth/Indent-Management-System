<div
  class="fixed bottom-0 left-0 right-0 top-0 z-20 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-black bg-opacity-50 backdrop-blur-sm"
>
  <div class="relative h-full w-full max-w-lg p-4 md:h-auto">
    <!-- Modal content -->
    <div
      class="animate__animated animate__bounceIn animate__faster relative rounded-lg bg-white p-4 text-center shadow dark:bg-gray-800 sm:p-5"
      >
      <div class="mr-4 mt-6">
        <h1 class="text-xl font-semibold text-purple-600">Add New Designation</h1>
      </div>
      <button
        (click)="closePopUp()"
        type="button"
        class="absolute right-2.5 top-2.5 ml-auto inline-flex items-center rounded-lg bg-transparent p-1.5 text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
        data-modal-toggle="successModal"
      >
        <svg
          aria-hidden="true"
          class="h-5 w-5"
          fill="currentColor"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          ></path>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
      <div class="flex flex-col">
        <div class="flex items-center justify-start gap-2">
            <label
                class="text-left font-semibold mt-4 mb-2 text-purple-600 text-base"
                >
                Select Level
            </label>
            <div class="mt-2 flex cursor-pointer items-center gap-1">
                <svg
                    class="h-3 w-3 text-purple-700 dark:text-white"
                    aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    fill="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                    fill-rule="evenodd"
                    d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm11-4.243a1 1 0 1 0-2 0V11H7.757a1 1 0 1 0 0 2H11v3.243a1 1 0 1 0 2 0V13h3.243a1 1 0 1 0 0-2H13V7.757Z"
                    clip-rule="evenodd"
                    />
                </svg>

                <a
                    (click)="addNewLevel()"
                    class="text-sm text-purple-500 hover:underline dark:text-blue-500"
                    >Add New Level
                </a>
            </div>
        </div>
        
        <select
            (change)="selectedLevelName($event)"
            class="rounded-lg"
            >
            <option value="" disabled>Choose Level</option>
            <option 
                *ngFor="let level of levelForDesignation"
                [value]="level.levelId">
                {{level.levelName}}
            </option>
        </select>

        <label
            class="text-left text-purple-600 mt-4 mb-2 font-semibold text-base"
            >
            Designation
        </label>
        <input 
            type="text"
            class="rounded-lg"
            [(ngModel)]="empDesignation"
        />
      </div>
      <div class="mt-8 flex justify-end gap-3">
        <div>
            <button
              type="submit"
              (click)="postNewDesignation(empDesignation)"
              class="w-full cursor-pointer rounded-lg border border-purple-600 bg-purple-500 px-5 py-3 text-center text-sm font-medium text-white hover:bg-purple-600 focus:ring-4 focus:ring-purple-300 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-800 sm:rounded-none sm:rounded-e-lg sm:rounded-s-lg"
            >
              Save
            </button>
          </div>
      </div>
      
    </div>
  </div>
</div>
<section
  *ngIf="isToast"
  class="fixed top-10 z-50 flex w-full items-center justify-center"
>
  <app-success-toast [message]="successToastMsg"></app-success-toast>
</section>
<section
  *ngIf="isDeleteToast"
  class="fixed top-10 z-50 flex w-full items-center justify-center"
>
  <app-delete-toast [message]="errorToastMsg"></app-delete-toast>
</section>
<section *ngIf="isViewAddNewLevel" class="absolute left-0 right-0 top-0 z-50 h-screen">
  <app-add-newlevel
    (close)="closeNewLevel($event)"
      ></app-add-newlevel>
</section>
