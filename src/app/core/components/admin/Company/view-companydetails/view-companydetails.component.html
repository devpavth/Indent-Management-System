<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm"
>
  <div
    class="relative w-full max-w-md rounded-lg bg-white p-6 shadow-lg dark:bg-gray-800 md:h-auto"
  >
    <button
      (click)="onClose()"
      type="button"
      class="absolute right-4 top-4 rounded-md p-0.5 text-gray-500 hover:bg-red-600 hover:text-white dark:hover:text-white"
    >
      <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
        <path
          fill-rule="evenodd"
          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </button>

    <h2
      class="mb-4 text-center text-xl font-semibold text-purple-600 dark:text-white"
    >
      Update Company Details
    </h2>

    <div class="flex flex-col items-center space-y-2">
      <div class="relative">
        <div
          class="group h-28 w-28 overflow-hidden rounded-full shadow-md shadow-gray-400 transition-shadow duration-300 ease-in-out hover:shadow-lg hover:shadow-gray-400"
        >
          <img
            *ngIf="companyDetails?.companyLogo; else defaultLogo"
            [src]="'data:image/png;base64,' + companyDetails?.companyLogo"
            alt="Company Logo"
            class="h-full w-full rounded-full object-contain transition-transform duration-300 ease-in-out group-hover:scale-110"
          />
        </div>

        <ng-template #defaultLogo>
          <div
            class="flex h-28 w-28 items-center justify-center rounded-full bg-gray-300 shadow-md"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#1f1f1f"
              class="h-14 w-14 text-gray-600"
            >
              <path
                d="M120-120v-560h160v-160h400v320h160v400H520v-160h-80v160H120Zm80-80h80v-80h-80v80Zm0-160h80v-80h-80v80Zm0-160h80v-80h-80v80Zm160 160h80v-80h-80v80Zm0-160h80v-80h-80v80Zm0-160h80v-80h-80v80Zm160 320h80v-80h-80v80Zm0-160h80v-80h-80v80Zm0-160h80v-80h-80v80Zm160 480h80v-80h-80v80Zm0-160h80v-80h-80v80Z"
              />
            </svg>
          </div>
        </ng-template>

        <button
          class="absolute bottom-0 right-0 rounded-full bg-purple-600 p-1.5 text-white shadow-md hover:bg-purple-700"
          (click)="uploadLogo()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"
            />
          </svg>
        </button>
      </div>
    </div>

    <div class="mt-5 flex flex-col">
      <label class="mb-1 font-medium text-purple-600">Company Name</label>
      <input type="text" class="rounded-lg" [(ngModel)]="updatedCompanyName" />
    </div>

    <div class="mt-4 flex justify-end">
      <button
        type="submit"
        [disabled]="!updatedCompanyName || isDisabled()"
        [ngClass]="{
          'border border-opacity-20 bg-opacity-60 hover:bg-opacity-60':
            !updatedCompanyName || isDisabled()
        }"
        class="rounded-lg border border-purple-600 bg-purple-600 px-4 py-2 font-medium text-white hover:bg-purple-700"
        (click)="updateCompanyName(updatedCompanyName)"
      >
        Confirm
      </button>
    </div>
  </div>
</div>

<section
  *ngIf="isViewUploadLogo"
  class="absolute left-0 right-0 top-0 z-50 h-screen"
>
  <app-upload-companylogo
    (logoUpdated)="fetchCompanyDetails()"
    (close)="closeUploadCompanyLogo($event)"
  ></app-upload-companylogo>
</section>

<section
  *ngIf="toastService.isSuccessToast"
  class="fixed top-10 z-50 flex w-full items-center justify-center"
>
  <app-success-toast
    [message]="toastService.successToastMsg"
  ></app-success-toast>
</section>
