<div class="p-4 sm:ml-64">
  <section class="dark:bg-gray-900">
    <div class="mx-auto">
      <h1 class="text-left ml-4 mb-2 text-lg text-purple-600 mt-2 font-semibold">Inward Alert</h1>
      <div
        class="relative overflow-hidden bg-white shadow-md shadow-purple-300 dark:bg-gray-800 sm:rounded-lg"
        > 
        
        <div class="overflow-x-auto" #test>
          <table
            class="w-full text-left text-sm text-gray-500 dark:text-gray-400"
            *ngIf="_inwardForBranch.length > 0; else noTransactions"
            >
            <thead
              class="bg-purple-50 text-xs uppercase text-purple-900 dark:bg-gray-700 dark:text-gray-400"
              >
              <tr>
                <th scope="col" class="px-4 py-3">
                  <div class="flex items-center justify-between">
                    <div>Transaction code</div>
                    <button
                      class="an rounded-full hover:bg-gray-600 hover:text-white"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        class="h-4 w-4"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M8.25 15 12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"
                        />
                      </svg>
                    </button>
                  </div>
                </th>

                <th scope="col" class="px-4 py-3">Branch Name</th>
                <th scope="col" class="px-4 py-3">Date</th>
                <th scope="col" class="px-4 py-3">Created By</th>
                
                <th scope="col" class="px-4 py-3">
                  <span class="sr-only">Actions</span>
                </th>
              </tr>
            </thead>
            <tbody>
              <tr
                class="border-b transition-all duration-300 hover:bg-gray-50 hover:text-gray-900 dark:border-gray-700"
                *ngFor="let inward of _inwardForBranch"
              >
                <th
                  scope="row"
                  class="select-all whitespace-nowrap px-4 py-3 font-medium text-gray-900 dark:text-white"
                >
                  {{ inward.prdtrnsCode }}
                </th>
                <td class="px-4 py-3">{{ inward.fromBranch.branchName }}</td>
                <td class="px-4 py-3">{{ inward.tranUpdOn | date:'dd-MM-yyyy'}}</td>
                <td class="px-4 py-3">{{ inward.tranUpdBy }}</td>
                <!-- <td class="px-4 py-3">{{ ven.vdrCountry }}</td> -->

                <td class="flex items-center justify-end px-4 py-3">
                  <button
                    (click)="toggleView(true, 1, inward)"
                    class="inline-flex items-center rounded-lg p-0.5 text-center text-sm font-medium text-gray-500 hover:text-gray-800 focus:outline-none dark:text-gray-400 dark:hover:text-gray-100"
                    type="button"
                  >
                    <svg
                      class="h-5 w-5"
                      aria-hidden="true"
                      fill="currentColor"
                      viewbox="0 0 20 20"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z"
                      />
                    </svg>
                  </button>
                </td>
              </tr>
            </tbody>
            
          </table>

          
        </div>
        <ng-template #noTransactions>
          <div class="flex h-96 items-center justify-center bg-white rounded-lg px-4">
            <div class="text-center">
              <img src="../../../../../assets/Img/9264882.svg" class="w-52 mx-auto" alt="No data available"/>
              <p class="text-gray-800 font-medium dark:text-gray-700 mt-4">No Transactions Available</p>
            </div>
          </div>
        </ng-template>

  </section>
</div>
<section *ngIf="isTransactionList" class="fixed left-0 right-0 top-0 z-40">
  <app-view-transaction
    (closeVendor)="toggleView($event, 0, '')"
    [transactionData]="transactionData"
  ></app-view-transaction>
</section>
