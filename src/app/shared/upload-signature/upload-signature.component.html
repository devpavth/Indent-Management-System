<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm"
  >
  <div class="relative w-full max-w-md p-6 md:h-auto bg-white rounded-lg shadow-lg dark:bg-gray-800">
      <button
        (click)="onClose()"
        type="button"
        class="absolute right-4 top-4 text-gray-400 hover:text-gray-900 dark:hover:text-white"
        >
         <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </button>

      <h2 class="text-xl font-semibold text-purple-600 dark:text-white text-center mb-4">Upload Signature</h2>

      <div class="flex flex-col items-center">
        <label for="file-upload"
          class="cursor-pointer flex flex-col items-center justify-center w-full h-40 border border-dashed border-gray-300 rounded-lg bg-gray-50 dark:border-gray-600 dark:bg-gray-700"
          >
          <svg class="h-10 w-10 text-gray-400 mb-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l4-4m-4 4l-4-4M4 16h16"></path>
          </svg>

          <span class="text-gray-500 text-sm dark:text-gray-400">Click to Upload Signature</span>
        </label>

        <input id="file-upload" type="file" (change)="onFileSelected($event)" class="hidden" accept="image/*"/>
      </div>

      <div 
        *ngIf="previewUrl"
        class="mt-4 flex justify-center"
        >
        <img 
          [src]="previewUrl" 
          alt="Signature Preview"
          class="h-24 w-auto rounded-md border border-gray-300"
        />
      </div>

      <button
        (click)="uploadSignature()"
        [disabled]="!selectedFile"
        [ngClass]="{
          'bg-gray-400 hover:bg-gray-400': !selectedFile
        }"
        class="mt-6 w-full px-4 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg focus:outline-none"
        >
        Upload Signature
      </button>
  </div>
</div>
<section
  *ngIf="isToast"
  class="fixed top-10 z-50 flex w-full items-center justify-center"
>
  <app-success-toast [message]="successToastMsg"></app-success-toast>
</section>
